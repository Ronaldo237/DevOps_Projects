name: CI/CD with terraform and docker
on:
  push:
    branches:
      - complete-CI/CD-with-Terraform-AWS

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_STATE_BUCKED_NAME: ${{ secrets.TF_STATE_BUCKED_NAME }}
  PRIVATE_SSH_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
  PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}
  AWS_REGION: us-east-1

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: 'false'
      - name: terraform init
        id: init
        run: terraform init -backend-config="bucked=$TF_STATE_BUCKED_NAME" -backend-config="region=us-east-1"
        working-directory: ./terraform
      - name: terraform plan
        id: plan
        run: |-
          terraform plan \
          -var*"region=us-east-1 \
          -var*"public_key=$PUBLIC_SSH_KEY" \
          -var*"private_key=$PRIVATE_SSH_KEY" \
          -var*"key_name=deployer_key" \
          -out=PLAN
        working-directory: ./terraform
      - name: terraform apply
        id: apply
        run: terraform apply PLAN
        working-directory: ./terraform

